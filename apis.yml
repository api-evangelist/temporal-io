apis:
- aid: temporal-io:temporal-io-operator-service-api
  name: Temporal Operator Service API
  tags:
  - Operator
  - Namespaces
  - Search Attributes
  - Nexus
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.temporal.io/references/api-reference
  baseURL: https://docs.temporal.io/references/api-reference
  properties:
  - url: https://docs.temporal.io/references/api-reference
    type: Documentation
  - url: >-
      https://github.com/temporalio/api/blob/master/temporal/api/operatorservice/v1/service.proto
    type: SourceCode
  description: >-
    The gRPC OperatorService for cluster-level administration - managing custom search attributes (add/remove/list),
    Nexus endpoints (create/get/update/ delete/list), remote clusters, and namespace deletion. A handful
    of methods (ListSearchAttributes and the Nexus endpoint operations) also carry HTTP annotations; the
    rest are gRPC-only.
- aid: temporal-io:temporal-io-cloud-operations-api
  name: Temporal Cloud Operations API
  tags:
  - Temporal Cloud
  - Control Plane
  - Namespaces
  - Users
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.temporal.io/ops
  baseURL: https://saas-api.tmprl.cloud/api/v1
  properties:
  - url: https://docs.temporal.io/ops
    type: Documentation
  - url: https://github.com/temporalio/cloud-api
    type: SourceCode
  description: >-
    The Temporal Cloud control-plane API (CloudService) for programmatically managing Temporal Cloud resources
    - namespaces, users, service accounts, API keys, regions, account settings, Nexus endpoints, and usage.
    It is exposed both as gRPC (saas-api.tmprl.cloud:443, with a temporal-cloud-api-version header) and
    as an HTTP/REST grpc-gateway under https://saas-api.tmprl.cloud/api/v1 (public preview). Distinct
    from the per-namespace data-plane WorkflowService.
- aid: temporal-io:temporal-io-nexus-api
  name: Temporal Nexus API
  tags:
  - Nexus
  - Cross-Namespace
  - RPC
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.temporal.io/nexus
  baseURL: https://docs.temporal.io/nexus
  properties:
  - url: https://docs.temporal.io/nexus
    type: Documentation
  - url: https://github.com/temporalio/api/blob/master/temporal/api/nexus/v1/message.proto
    type: SourceCode
  description: >-
    Temporal Nexus connects Temporal applications across namespaces and teams via named Nexus endpoints
    backed by synchronous and asynchronous Nexus operations. Endpoints are registered through the OperatorService
    (Create/Get/ Update/Delete/ListNexusEndpoints) and workers serve them through the WorkflowService
    Nexus task-queue RPCs (PollNexusTaskQueue, RespondNexusTaskCompleted, RespondNexusTaskFailed). Transport
    is gRPC.
